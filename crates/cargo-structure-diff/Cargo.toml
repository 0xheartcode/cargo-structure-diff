[package]
name = "cargo-structure-diff"
description = "Structural diff for Rust crates: extract the module graph, diff base against head, render it as Mermaid, and gate on architectural lints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Symlinked to the workspace README so crates.io renders it (one source of truth; cargo
# dereferences the symlink into the package).
readme = "README.md"

[[bin]]
name = "csd"
path = "src/main.rs"

[[bin]]
name = "cargo-structure-diff"
path = "src/cargo_shim.rs"

[dependencies]
anyhow = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
glob = "0.3"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
layout-rs = "0.1"

[dev-dependencies]
tempfile = "3"
