[package]
name = "csd-harness"
description = "M0 validation harness for cargo-structure-diff: replay merged PRs and measure rename false positives. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "csd-harness"
path = "src/main.rs"

# The whole library is now the single cargo-structure-diff crate; the harness uses its ir/diff/
# lint/extract/config modules plus its public init_config and zero_config_defaults.
[dependencies]
cargo-structure-diff = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
