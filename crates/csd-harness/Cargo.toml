[package]
name = "csd-harness"
description = "M0 validation harness for cargo-structure-diff: replay merged PRs and measure rename false positives. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "csd-harness"
path = "src/main.rs"

[dependencies]
csd-ir = { workspace = true, features = ["serde"] }
csd-diff = { workspace = true }
csd-extract-rs = { workspace = true }
csd-config = { workspace = true }
csd-lint = { workspace = true }
# The CLI crate's library, so the replay runs the gate under exactly the config `csd init`
# generates (via its public `init_config`), never a drifting hand-maintained copy.
cargo-structure-diff = { path = "../cargo-structure-diff" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
