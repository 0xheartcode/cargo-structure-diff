[package]
name = "csd-extract-rs"
description = "Rust source to structural graph IR for cargo-structure-diff, via tree-sitter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
csd-ir = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
# tree-sitter grammars for the M0 extractor (backlog `extract`). tree-sitter-rust 0.24 is built
# against the tree-sitter 0.25/0.26 ABI and exposes the grammar as a `LanguageFn` (`LANGUAGE`).
tree-sitter = "0.26"
tree-sitter-rust = "0.24"

[dev-dependencies]
tempfile = "3"
