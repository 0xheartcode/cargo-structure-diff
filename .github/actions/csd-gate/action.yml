name: cargo-structure-diff gate
description: >-
  Diff a pull request against its base with cargo-structure-diff, post the structural changelog as a
  sticky comment, and fail the check on architectural lint denials.

inputs:
  base:
    description: Base ref to diff against. Defaults to origin/<the PR base branch>.
    required: false
    default: ""
  ref:
    description: Git ref of cargo-structure-diff to install the csd binary from.
    required: false
    default: main
  comment:
    description: Post the changelog as a sticky PR comment.
    required: false
    default: "true"
  token:
    description: Token used to read and post the PR comment.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install csd
      shell: bash
      run: >-
        cargo install --git https://github.com/0xheartcode/cargo-structure-diff
        --rev "${{ inputs.ref }}" --bin csd --locked
        || cargo install --git https://github.com/0xheartcode/cargo-structure-diff
        --rev "${{ inputs.ref }}" --bin csd

    - name: Resolve base ref
      id: base
      shell: bash
      run: |
        set -euo pipefail
        base="${{ inputs.base }}"
        if [ -z "$base" ]; then
          base_branch="${{ github.base_ref }}"
          if [ -z "$base_branch" ]; then
            echo "csd-gate: no base provided and github.base_ref is empty (not a pull_request event?)." >&2
            echo "csd-gate: pass the 'base' input, e.g. base: origin/main." >&2
            exit 1
          fi
          # actions/checkout defaults to a shallow clone, so the base commit is usually absent.
          # Fetch just the base branch tip; csd diffs that against the working tree.
          if ! git fetch --no-tags --depth=1 origin "$base_branch"; then
            echo "csd-gate: failed to fetch base branch '$base_branch' from origin." >&2
            echo "csd-gate: ensure the workflow has 'contents: read' and actions/checkout ran." >&2
            exit 1
          fi
          base="origin/$base_branch"
        fi
        # Verify the base ref actually resolves before handing it to csd, for a clear early error.
        if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
          echo "csd-gate: base ref '$base' does not resolve to a commit after fetch." >&2
          exit 1
        fi
        echo "ref=$base" >> "$GITHUB_OUTPUT"

    - name: Structure gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CSD_COMMENT: ${{ inputs.comment }}
      run: >-
        "${{ github.action_path }}/../../../scripts/csd-structure-gate.sh"
        "${{ steps.base.outputs.ref }}"
