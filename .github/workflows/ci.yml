name: CI

# fmt-check and clippy run once on Linux (they are platform-independent); the test suite runs on
# Linux and Windows. Linux covers the Unix case (LF, forward-slash paths) and Windows covers the real
# cross-platform divergence (CRLF, backslash paths), which is what the golden tests guard. macOS
# behaves like Linux for this git + tree-sitter tool, so it adds little test signal while its arm64
# runners are capacity-constrained and get cancelled; macOS is still compiled in the release workflow.
# cargo is called directly so no `just` install is needed.

on:
  push:
  pull_request:

jobs:
  lint:
    name: fmt + clippy (stable, linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (stable, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace
