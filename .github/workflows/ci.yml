name: CI

# fmt-check and clippy run once on Linux (they are platform-independent); the test suite runs on
# Linux, macOS and Windows so golden output and path handling are verified on every target. Together
# these mirror the local `just gate` recipe. cargo is called directly so no `just` install is needed.

on:
  push:
  pull_request:

jobs:
  lint:
    name: fmt + clippy (stable, linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (stable, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace
