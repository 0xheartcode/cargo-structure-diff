name: Release

# Build prebuilt `csd` and `cargo-structure-diff` binaries for Linux, macOS and Windows and attach
# them to a GitHub Release when a version tag (v*) is pushed. No crates.io involved: users download a
# binary from the release, and the CI gate action can fetch one instead of compiling from source.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin csd --bin cargo-structure-diff

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="csd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          dir="dist/$name"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/csd" "target/${{ matrix.target }}/release/cargo-structure-diff" "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar -C dist -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="csd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          dir="dist/$name"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/csd.exe" "target/${{ matrix.target }}/release/cargo-structure-diff.exe" "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          7z a "$name.zip" "./dist/$name"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          draft: true
          generate_release_notes: true
