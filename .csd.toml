# cargo-structure-diff, configured to gate its own architecture.
# See SPEC.md section 7 for the full schema.

[layers]
# Two strata, top (may depend downward) to bottom. csd-ir is the shared contract every other
# crate projects against; nothing it declares may depend back up on a sibling crate. First
# matching glob wins, so the csd-ir mapping must precede the catch-all.
order = ["app", "contract"]
map = [
    { layer = "contract", glob = "crates/csd-ir/**" },
    { layer = "app",      glob = "crates/**" },
]
# The contract must not depend on the application crates above it. This is currently satisfied
# (csd-ir depends only on serde), so the gate is green; a future csd-ir -> sibling edge fails it.
forbid = [{ from = "contract", to = "app" }]

[views]
# The module view is the gate's error message: small and legible, and where layering shows.
# Other views (overview, types, states, calls, schema) are available via csd doc or by listing
# them here.
enabled = ["modules"]

[lint]
deny = ["layering", "cycles"]
warn = ["fan_in", "fan_out"]

# Default CI behaviour: fail only on violations new since the base ref.
[ratchet]
mode = "new-only"
