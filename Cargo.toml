[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xheartcode/cargo-structure-diff"
authors = ["0xheartcode <salaryman75@gmail.com>"]

[workspace.dependencies]
# shared internal crates
csd-ir = { path = "crates/csd-ir", version = "0.0.0" }
csd-diff = { path = "crates/csd-diff", version = "0.0.0" }
csd-extract-rs = { path = "crates/csd-extract-rs", version = "0.0.0" }

# third-party, pinned at the workspace so every crate agrees
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
