[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xheartcode/cargo-structure-diff"
authors = ["0xheartcode <0xheartcode@gmail.com>"]

[workspace.dependencies]
# The library crates were collapsed into the single `cargo-structure-diff` crate (one published
# crate). The only internal dependency left is the test crates pointing at it, by path.
cargo-structure-diff = { path = "crates/cargo-structure-diff" }

# third-party, pinned at the workspace so every crate agrees
anyhow = "1"
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
